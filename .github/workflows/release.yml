name: Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（重试用：输入已有 tag 的版本；正常发版由 bump PR 合并自动触发）'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  # bump PR 合并后（package.json 版本变化落到 main）自动补 tag。
  # tag 指向合并提交；若 HEAD 后来又漂移，release 阶段会检出 tag 树构建
  tag:
    name: Tag merged release commit
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tagged: ${{ steps.tag.outputs.tagged }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve released version
        id: resolve
        run: |
          set -eu
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create tag if missing
        id: tag
        env:
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -eu
          tag="v${RELEASE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists; nothing to release"
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          manifest_version=$(node -p "require('./versions.json').latest.version")
          if [ "${manifest_version}" != "${RELEASE_VERSION}" ]; then
            echo "::warning::package.json 是 ${RELEASE_VERSION}，但 versions.json latest 是 ${manifest_version}，不是 bump PR 合并；跳过发版"
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "${tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${tag}"
          echo "tagged=true" >> "$GITHUB_OUTPUT"

  release:
    needs: [tag]
    # dispatch：人工重试已有 tag 的版本；push：仅当本次 push 新打了 tag
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.tag.outputs.tagged == 'true'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # stable keystore 挂在 release environment 上，触发后需维护者审批才运行
    environment: release

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      R2_KEY_PREFIX: ${{ secrets.R2_KEY_PREFIX }}
      R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
      KEYSTORE_STABLE: ${{ secrets.KEYSTORE_STABLE }}
      KEYSTORE_STABLE_PASS: ${{ secrets.KEYSTORE_STABLE_PASS }}
      # 证书指纹为公开信息（随每个 APK 分发），在此固定以防 secret 配错密钥
      KEYSTORE_STABLE_CERT_SHA256: '56:5B:D0:43:9B:AB:27:7B:12:7E:D3:3B:31:60:85:D5:56:EA:25:0D:F1:47:53:4E:35:6E:4A:E5:77:C2:60:53'

    steps:
      - name: Checkout repository and pinned manual
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # 全量历史与 tag：ci.mjs 需要解析 tag 目标提交（HEAD 与 tag 漂移时检出 tag 树）
          fetch-depth: 0
          # 发版只构建与发布，不回推 main，无需推送凭证
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: npm ci

      - name: Build and publish from the tagged bump commit
        run: node scripts/release/ci.mjs "${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.tag.outputs.version }}"
