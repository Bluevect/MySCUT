<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1677ff" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>MySCUT</title>
  </head>
  <body>
    <div id="root">
      <!-- 静态启动骨架：在 JS 求值前占位，React 挂载后由 AppBootstrapSkeleton 接管并替换 -->
      <div class="app-bootstrap-skeleton" aria-hidden="true">
        <div class="bootstrap-header">
          <div class="bootstrap-header-text">
            <div class="bootstrap-bar bootstrap-bar--title"></div>
            <div class="bootstrap-bar bootstrap-bar--sub"></div>
          </div>
          <div class="bootstrap-header-actions">
            <span class="bootstrap-icon-btn"></span>
            <span class="bootstrap-icon-btn"></span>
            <span class="bootstrap-icon-btn"></span>
          </div>
        </div>
        <div class="bootstrap-schedule"></div>
        <nav class="bootstrap-tabbar">
          <span class="bootstrap-tab">
            <span class="bootstrap-tab-icon"></span>
            <span class="bootstrap-bar bootstrap-bar--tab"></span>
          </span>
          <span class="bootstrap-tab">
            <span class="bootstrap-tab-icon"></span>
            <span class="bootstrap-bar bootstrap-bar--tab"></span>
          </span>
          <span class="bootstrap-tab">
            <span class="bootstrap-tab-icon"></span>
            <span class="bootstrap-bar bootstrap-bar--tab"></span>
          </span>
        </nav>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
